spring:
  application:
    name: compraflow
  datasource:
    url: jdbc:h2:mem:compraflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

compraflow:
  policies:
    min-quotes: 3
    approval:
      coordinator-limit: 2000.00
      manager-limit: 10000.00
      director-limit: 50000.00

integrations:
  frankfurter:
    url: https://api.frankfurter.dev

logging:
  level:
    org.hibernate.SQL: warn
